name: iOS Preview RC Build

on:
  push:
    branches:
      - build/ios-preview-0f02da0

permissions:
  contents: read

jobs:
  eas-preview:
    name: EAS iOS preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact RC app commit
        uses: actions/checkout@v4
        with:
          ref: 0f02da03ae1c410bf543a4c55bd224440ed97521

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify mobile config
        run: npm run check:config

      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN GitHub secret is missing."
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Start and wait for iOS preview build
        run: |
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json
          cat eas-build.json

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxa-ios-preview-build-metadata
          path: eas-build.json
          if-no-files-found: ignore
          retention-days: 7